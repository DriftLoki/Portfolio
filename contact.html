<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugenio Sotelo | Contact</title>
    <style>
        /* Modern Minimalist High-Contrast Palette */
        :root {
            --bg: #0b0b0c;
            --text-primary: #ffffff;
            --text-secondary: #88888b;
            --border-color: #222224;
            --accent: #c4fc04;
            --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-stack);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Static Global Top Navigation Bar */
        header {
            width: 100%;
            background-color: var(--bg);
            border-bottom: 2px solid var(--accent);
        }

        .navbar {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 24px 60px;
        }

        /* Top-Left Header Name - Identical across all pages linking to home */
        .nav-logo {
            font-size: 2.2rem; 
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-logo:hover {
            color: var(--accent);
        }

        .nav-links-group {
            display: flex;
            gap: 24px;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--accent);
        }

        /* Contact Section Alignment Container */
        .contact-wrapper {
            width: 100%;
            max-width: 100%;
            padding: 60px 60px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .page-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 10px;
        }

        /* Grid System for Communication Nodes */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        /* Interactive Contact Card Row */
        .contact-card {
            display: flex;
            align-items: center;
            background-color: #121214;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .contact-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        /* Left Side: Brand Logo Vector Frame */
        .logo-box {
            flex: 0 0 64px;
            height: 64px;
            background-color: #1a1a1e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            padding: 14px;
        }

        .logo-box svg {
            width: 100%;
            height: 100%;
            fill: var(--text-primary);
            transition: fill 0.2s ease;
        }

        .contact-card:hover .logo-box svg {
            fill: var(--accent);
        }

        /* Right Side: Communication Meta Details Column */
        .contact-details {
            display: flex;
            flex-direction: column;
        }

        .method-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .communication-string {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            word-break: break-all;
        }

        /* Responsive Mobile Layout Adaptations */
        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .navbar {
                flex-direction: column;
                gap: 16px;
                padding: 18px 20px;
                text-align: center;
            }
            .contact-wrapper {
                padding: 40px 20px;
            }
            .communication-string {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
